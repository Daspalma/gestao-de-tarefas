<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - Gestão de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html">Início</a>
        <a href="tarefas.html">Tarefas</a>
        <a href="usuarios.html">Usuários</a>
        <a href="#" onclick="fazerLogout()" class="sair">Sair</a>
    </nav>

    <div class="conteudo">
        <h2>Cadastro de Usuário</h2>
        <p>Cadastre novos membros da equipe para atribuir tarefas.</p>

        <form id="formUsuario">
            <div class="campo">
                <label>Nome Completo:</label>
                <input id="nomeUsuario" type="text" placeholder="Ex: Fernanda Lima" required>
            </div>

            <div class="linha-dupla">
                <div class="campo">
                    <label>Login / E-mail:</label>
                    <input id="loginUsuario" type="text" placeholder="Ex: fernanda.lima" required>
                </div>

                <div class="campo">
                    <label>Senha:</label>
                    <input id="senhaUsuario" type="password" placeholder="Senha do usuário" required>
                </div>
            </div>

            <div style="margin-top: 10px;">
                <button type="submit">Cadastrar Usuário</button>
            </div>
        </form>

        <h2>Usuários Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th style="width: 50px;">ID</th>
                    <th>Nome</th>
                    <th>Login</th>
                    <th style="width: 100px;">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaUsuarios">
                <tr><td colspan="4" style="text-align: center;">Carregando usuários...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="js/funcoes.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
