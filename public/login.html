<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-box">
        <h2>Gestão de Tarefas</h2>
        <p style="text-align: center; margin-bottom: 15px;">Informe suas credenciais</p>

        <form id="formularioDeLogin">
            <div class="campo">
                <label>Login:</label>
                <input id="login" type="text" placeholder="Ex: admin" required autofocus>
            </div>

            <div class="campo">
                <label>Senha:</label>
                <input id="senha" type="password" placeholder="Sua senha" required>
            </div>

            <button type="submit" style="width: 100%; margin-top: 10px;">Entrar</button>
        </form>

        <div class="dica-login">
            <strong>Credenciais de teste:</strong><br>
            Login: <b>admin</b> | Senha: <b>12345</b><br>
            Login: <b>joao.silva</b> | Senha: <b>12345</b>
        </div>
    </div>

    <script src="js/funcoes.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
