<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Gestão de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html">Início</a>
        <a href="tarefas.html">Tarefas</a>
        <a href="usuarios.html">Usuários</a>
        <a href="#" onclick="fazerLogout()" class="sair">Sair</a>
    </nav>

    <div class="conteudo">
        <h2 id="mensagemDeBoasVindas">Bem-vindo!</h2>
        <p>Visão geral do sistema de tarefas e atividades da equipe.</p>

        <!-- Indicadores rápidos -->
        <div class="resumo-cards">
            <div class="card-item">
                <h3 id="numTotal">0</h3>
                <span>Total de Tarefas</span>
            </div>
            <div class="card-item">
                <h3 id="numPendentes" style="color: #d97706;">0</h3>
                <span>Pendentes</span>
            </div>
            <div class="card-item">
                <h3 id="numAndamento" style="color: #0284c7;">0</h3>
                <span>Em Andamento</span>
            </div>
            <div class="card-item">
                <h3 id="numConcluidas" style="color: #16a34a;">0</h3>
                <span>Concluídas</span>
            </div>
        </div>

        <h2>Ações Rápidas</h2>
        <p>
            <a href="tarefas.html"><button type="button">Gerenciar Tarefas</button></a>
            <a href="usuarios.html"><button type="button" class="btn-cancelar">Gerenciar Usuários</button></a>
        </p>

        <h2 style="margin-top: 30px;">Últimas Tarefas Cadastradas</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Título</th>
                    <th>Setor</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                    <th>Responsável</th>
                </tr>
            </thead>
            <tbody id="tabelaRecentes">
                <tr><td colspan="6" style="text-align: center;">Carregando...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="js/funcoes.js"></script>
    <script>
        async function carregarDashboard() {
            // Carrega números do resumo
            const resumo = await chamandoServer('/resumo')
            if (resumo) {
                document.getElementById('numTotal').textContent = resumo.total || 0
                document.getElementById('numPendentes').textContent = resumo.pendentes || 0
                document.getElementById('numAndamento').textContent = resumo.emAndamento || 0
                document.getElementById('numConcluidas').textContent = resumo.concluidas || 0
            }

            // Carrega tarefas recentes
            const tarefas = await chamandoServer('/tarefa')
            const tbody = document.getElementById('tabelaRecentes')
            if (Array.isArray(tarefas) && tarefas.length > 0) {
                tbody.innerHTML = tarefas.slice(0, 5).map(t => `
                    <tr>
                        <td>${t.id}</td>
                        <td><b>${t.titulo}</b></td>
                        <td>${t.setor}</td>
                        <td>${t.prioridade}</td>
                        <td>${t.status}</td>
                        <td>${t.responsavel || '-'}</td>
                    </tr>
                `).join('')
            } else {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Nenhuma tarefa encontrada.</td></tr>'
            }
        }

        carregarDashboard()
    </script>
</body>
</html>
