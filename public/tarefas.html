<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefas - Gestão de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="brand">Gestão de Tarefas</a>
        <div class="menu">
            <a href="index.html">Início</a>
            <a href="tarefas.html" class="active">Tarefas</a>
            <a href="#" onclick="fazerLogout()" class="btn-sair">Sair</a>
        </div>
    </nav>

    <div class="container">
        <!-- Card de Formulário (Cadastrar / Editar) -->
        <div class="card">
            <h2>Gerenciar Tarefa</h2>
            <p class="subtitulo">Preencha os campos abaixo para adicionar ou atualizar uma tarefa.</p>

            <form id="formulario">
                <input type="hidden" id="id">

                <div>
                    <label>
                        Título da Tarefa *
                        <input id="titulo" placeholder="Ex: Criar componente de login" required>
                    </label>
                </div>

                <div>
                    <label>
                        Descrição
                        <textarea id="descricao" placeholder="Detalhes adicionais da tarefa..." rows="2"></textarea>
                    </label>
                </div>

                <div class="form-grid">
                    <label>
                        Status
                        <select id="status">
                            <option value="Pendente">Pendente</option>
                            <option value="Em Andamento">Em Andamento</option>
                            <option value="Concluída">Concluída</option>
                        </select>
                    </label>

                    <label>
                        Prioridade
                        <select id="prioridade">
                            <option value="Baixa">Baixa</option>
                            <option value="Média" selected>Média</option>
                            <option value="Alta">Alta</option>
                        </select>
                    </label>
                </div>

                <div class="acoes-form">
                    <button type="submit" id="btnSalvar">Salvar Tarefa</button>
                    <button type="button" id="btnCancelar" class="btn-secundario" style="display: none;" onclick="limparFormulario()">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Card da Tabela de Tarefas -->
        <div class="card">
            <h2>Lista de Tarefas</h2>
            <p class="subtitulo">Todas as tarefas registradas no sistema.</p>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;">ID</th>
                            <th>Título & Descrição</th>
                            <th style="width: 140px;">Status</th>
                            <th style="width: 110px;">Prioridade</th>
                            <th style="width: 140px;">Responsável</th>
                            <th style="width: 150px;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela">
                        <!-- Linhas geradas dinamicamente pelo JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/funcoes.js"></script>
    <script src="js/tarefas.js"></script>
</body>
</html>
